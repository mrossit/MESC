          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        preferredPosition:
          type: integer
          nullable: true
        preferredPositions:
          type: array
          items:
            type: integer
        avoidPositions:
          type: array
          items:
            type: integer
        preferredTimes:
          type: array
          items:
            type: string
        ministryStartDate:
          type: string
          nullable: true
        dataQuality:
          $ref: "#/components/schemas/ProfileReadiness"
        deepLink:
          type: string
    MissionHome:
      type: object
      required: [success, user, community, nextMission, pendingActions, monthlySummary, notices, sync]
