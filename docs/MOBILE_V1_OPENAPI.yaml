    AdminQuestionnaireReminderRequest:
      type: object
      properties:
        target:
          type: string
          enum: [pending_questionnaire, data_quality, pending_or_data_quality]
          default: pending_questionnaire
        dataQualityStatuses:
          type: array
          description: Profile readiness statuses included when target checks data quality.
          items:
            type: string
            enum: [blocked, needs_attention]
        ministerIds:
          type: array
          description: Optional subset of questionnaire target ministers to evaluate.
          items:
            type: string
        message:
          type: string
          nullable: true
        dryRun:
          type: boolean
          default: false
    AdminQuestionnaireReminderResponse:
      type: object
      required: [success, community, questionnaire, reminder]
      properties:
        success:
          type: boolean
        community:
          $ref: "#/components/schemas/Community"
        questionnaire:
          type: object
          required: [id, title, month, year, status, deadline]
          properties:
            id:
              type: string
            title:
              type: string
            month:
              type: integer
            year:
              type: integer
            status:
              type: string
            deadline:
              type: string
              nullable: true
        reminder:
          type: object
          required:
            - target
            - dryRun
            - deliveredCount
            - recipientCount
            - skippedCount
            - recipients
          properties:
            target:
              type: string
              enum: [pending_questionnaire, data_quality, pending_or_data_quality]
            dryRun:
              type: boolean
            deliveredCount:
              type: integer
            recipientCount:
              type: integer
            skippedCount:
              type: integer
            recipients:
              type: array
              items:
                type: object
                required:
                  - id
                  - name
                  - email
                  - responded
                  - dataQualityStatus
                  - notificationId
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  responded:
                    type: boolean
                  dataQualityStatus:
                    type: string
                    enum: [ready, needs_attention, blocked]
                  notificationId:
                    type: string
                    nullable: true
