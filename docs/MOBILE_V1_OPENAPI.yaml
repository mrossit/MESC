              type: integer
            nextScheduleId:
              type: string
              nullable: true
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        sync:
          type: object
          required: [serverTime, cacheMaxAgeSeconds]
          properties:
            serverTime:
              type: string
              format: date-time
            cacheMaxAgeSeconds:
              type: integer
    ScheduleSummary:
      type: object
      required: [id, date, time, type, position, status, deepLink]
      properties:
        id:
          type: string
        date:
          type: string
          nullable: true
        time:
          type: string
        type:
          type: string
        location:
          type: string
          nullable: true
        position:
          type: integer
          nullable: true
        status:
          type: string
        notes:
          type: string
          nullable: true
        confirmationStatus:
          type: string
          nullable: true
        canConfirm:
          type: boolean
        canRequestSubstitution:
          type: boolean
        deepLink:
          type: string
    PublicScheduleMonth:
      type: object
      required: [assignments, exportFormats]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/PublicScheduleAssignment"
        exportFormats:
          type: array
          items:
            type: string
            enum: [html, pdf, excel]
    PublicScheduleAssignment:
      type: object
      required:
