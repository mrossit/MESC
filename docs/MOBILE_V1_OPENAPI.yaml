        - time
        - type
        - location
        - position
        - status
        - notes
        - ministerId
        - ministerName
        - scheduleDisplayName
        - source
        - isCurrentUser
      properties:
        id:
          type: string
        scheduleId:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        type:
          type: string
        location:
          type: string
          nullable: true
        position:
          type: integer
        status:
          type: string
        notes:
          type: string
          nullable: true
        ministerId:
          type: string
          nullable: true
        ministerName:
          type: string
          nullable: true
        scheduleDisplayName:
          type: string
          nullable: true
        source:
          type: string
          enum: [schedule, adoration]
        isCurrentUser:
          type: boolean
    ScheduleDetail:
      allOf:
        - $ref: "#/components/schemas/ScheduleSummary"
        - type: object
          properties:
            confirmationStatus:
              type: string
              nullable: true
            substitution:
              type: object
              nullable: true
            canConfirm:
              type: boolean
            canRequestSubstitution:
              type: boolean
    PendingAction:
      type: object
      required: [id, type, title, priority, deepLink]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [questionnaire, substitution, notice]
        title:
          type: string
        subtitle:
          type: string
        priority:
          type: string
          enum: [normal, high]
        deepLink:
          type: string
        dueAt:
          type: string
          nullable: true
    Notice:
      type: object
      required: [id, type, eventKey, title, message, read, deepLink, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
        eventKey:
          type: string
          nullable: true
          enum:
            - questionnaire_published
            - coordinator_announcement
