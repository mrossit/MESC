openapi: 3.0.3
info:
  title: MESC Mobile API
  version: 1.0.0
  description: Initial mobile-native contract for MESC Native MVP milestone 1.
servers:
  - url: /api/mobile/v1
security:
  - bearerAuth: []
paths:
  /app/config:
    get:
      summary: Read public mobile app configuration.
      security: []
      parameters:
        - in: query
          name: platform
          schema:
            type: string
            enum: [ios, android]
      responses:
        "200":
          description: Mobile runtime configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
  /auth/login:
    post:
      summary: Authenticate a mobile user with email and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                keepSignedIn:
                  type: boolean
                  default: false
                deviceId:
                  type: string
                platform:
                  type: string
                  enum: [ios, android]
                appVersion:
                  type: string
      responses:
        "200":
          description: Authenticated mobile session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid login payload.
        "401":
          description: Invalid credentials or inactive account.
        "429":
          description: Authentication rate limit exceeded.
  /auth/refresh:
    post:
      summary: Rotate a mobile refresh token and return a new access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                deviceId:
                  type: string
      responses:
        "200":
          description: Rotated mobile session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Expired, reused, revoked, or invalid refresh token.
        "429":
          description: Refresh rate limit exceeded.
  /auth/biometric-session:
    post:
      summary: Create a renewable mobile session for native biometric unlock.
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                platform:
                  type: string
                  enum: [ios, android]
                appVersion:
                  type: string
      responses:
        "200":
          description: Renewable session prepared for Keychain or Keystore storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Expired access token or inactive account.
  /auth/logout:
    post:
      summary: Revoke the current mobile device and its refresh tokens.
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                deviceDbId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Device session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [success, revoked]
                properties:
                  success:
                    type: boolean
                  revoked:
                    type: boolean
  /auth/me:
    get:
      summary: Read the authenticated mobile user and available communities.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                required: [success, user, communities, activeCommunityId]
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/MobileUser"
                  communities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Community"
                  activeCommunityId:
                    type: string
  /devices:
    get:
      summary: List mobile devices registered by the authenticated user.
      responses:
        "200":
          description: Registered devices.
          content:
            application/json:
              schema:
                type: object
                required: [success, devices]
                properties:
                  success:
                    type: boolean
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/MobileDevice"
  /devices/current:
    get:
      summary: Read the current native device registration.
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
      responses:
        "200":
          description: Current device registration.
          content:
            application/json:
              schema:
                type: object
                required: [success, device]
                properties:
                  success:
                    type: boolean
                  device:
                    $ref: "#/components/schemas/MobileDevice"
        "400":
          description: Missing X-Device-Id header.
        "404":
          description: Current device not found.
    put:
      summary: Create or update the current native device registration.
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                platform:
                  type: string
                  enum: [ios, android]
                appVersion:
                  type: string
                pushToken:
                  type: string
                  nullable: true
                pushProvider:
                  type: string
                  enum: [apns, fcm]
                  nullable: true
                pushEnabled:
                  type: boolean
                biometricCapable:
                  type: boolean
                biometricEnabled:
                  type: boolean
                notificationPreferences:
                  type: object
      responses:
        "200":
          description: Current device registration.
          content:
            application/json:
              schema:
                type: object
                required: [success, device]
                properties:
                  success:
                    type: boolean
                  device:
                    $ref: "#/components/schemas/MobileDevice"
  /devices/{id}:
    delete:
      summary: Revoke one registered mobile device.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device revoked.
          content:
            application/json:
              schema:
                type: object
                required: [success, revoked]
                properties:
                  success:
                    type: boolean
                  revoked:
                    type: boolean
        "404":
          description: Device not found.
  /profile:
    get:
      summary: Read the authenticated user's mobile profile.
      responses:
        "200":
          description: Mobile profile payload.
          content:
            application/json:
              schema:
                type: object
                required: [success, profile]
                properties:
                  success:
                    type: boolean
                  profile:
                    $ref: "#/components/schemas/MobileProfile"
    patch:
      summary: Update editable mobile profile fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  nullable: true
                whatsapp:
                  type: string
                  nullable: true
                scheduleDisplayName:
                  type: string
                  nullable: true
                ministryStartDate:
                  type: string
                  nullable: true
                maritalStatus:
                  type: string
                  nullable: true
                preferredPosition:
                  type: integer
                  nullable: true
                preferredPositions:
                  type: array
                  items:
                    type: integer
                avoidPositions:
                  type: array
                  items:
                    type: integer
                preferredTimes:
                  type: array
                  items:
                    type: string
                availableForSpecialEvents:
                  type: boolean
                extraActivities:
                  type: object
      responses:
        "200":
          description: Updated mobile profile.
          content:
            application/json:
              schema:
                type: object
                required: [success, profile]
                properties:
                  success:
                    type: boolean
                  profile:
                    $ref: "#/components/schemas/MobileProfile"
  /notifications:
    get:
      summary: List recent notifications for the authenticated user.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Notification list.
          content:
            application/json:
              schema:
                type: object
                required: [success, notifications, unreadCount]
                properties:
                  success:
                    type: boolean
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/MobileNotification"
                  unreadCount:
                    type: integer
  /notifications/read-all:
    patch:
      summary: Mark all notifications as read.
      responses:
        "200":
          description: Notifications marked as read.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
  /notifications/{id}/read:
    patch:
      summary: Mark one notification as read.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification marked as read.
          content:
            application/json:
              schema:
                type: object
                required: [success, notification]
                properties:
                  success:
                    type: boolean
                  notification:
                    type: object
                    required: [id, read, readAt]
                    properties:
                      id:
                        type: string
                      read:
                        type: boolean
                      readAt:
                        type: string
                        nullable: true
        "404":
          description: Notification not found for the current user.
  /privacy/account-deletion-info:
    get:
      summary: Read account deletion instructions and retained/deleted data summary.
      responses:
        "200":
          description: Account deletion information.
          content:
            application/json:
              schema:
                type: object
  /account:
    delete:
      summary: Delete or anonymize the authenticated user's account from the native app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation, password]
              properties:
                confirmation:
                  type: string
                  example: EXCLUIR MINHA CONTA
                password:
                  type: string
      responses:
        "200":
          description: Account deleted/anonymized.
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Missing confirmation or password.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Invalid password.
  /questionnaires/current:
    get:
      summary: Read the current published questionnaire for the active community/month.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - in: query
          name: month
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Current questionnaire or null when none is published.
          content:
            application/json:
              schema:
                type: object
                required: [success, community, month, questionnaire]
                properties:
                  success:
                    type: boolean
                  community:
                    $ref: "#/components/schemas/Community"
                  month:
                    type: string
                    description: Effective questionnaire month. May be the next published month when the requested month has no published questionnaire.
                  questionnaire:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/Questionnaire"
  /questionnaires/{id}/response:
    post:
      summary: Submit or update the authenticated user's questionnaire response.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responses]
              properties:
                responses:
                  type: array
                  items:
                    $ref: "#/components/schemas/QuestionnaireAnswer"
                sharedWithFamilyIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Questionnaire response saved.
          content:
            application/json:
              schema:
                type: object
                required: [success, response]
                properties:
                  success:
                    type: boolean
                  response:
                    type: object
        "400":
          description: Invalid payload or missing/invalid Idempotency-Key.
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
  /formation/overview:
    get:
      summary: Read the authenticated minister's native formation overview.
      responses:
        "200":
          description: Formation tracks, modules, lessons, progress and summary.
          content:
            application/json:
              schema:
                type: object
                required: [success, overview]
                properties:
                  success:
                    type: boolean
                  overview:
                    type: object
        "401":
          description: Missing or invalid bearer token.
  /formation/{trackId}/{moduleId}/{lessonNumber}:
    get:
      summary: Read a native formation lesson with content sections and progress.
      parameters:
        - in: path
          name: trackId
          required: true
          schema:
            type: string
        - in: path
          name: moduleId
          required: true
          schema:
            type: string
        - in: path
          name: lessonNumber
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lesson detail, sections and progress.
          content:
            application/json:
              schema:
                type: object
                required: [success, lesson, sections, progress]
                properties:
                  success:
                    type: boolean
                  lesson:
                    type: object
                  sections:
                    type: array
                    items:
                      type: object
                  progress:
                    type: object
        "404":
          description: Lesson not found.
  /formation/lessons/{lessonId}/complete:
    post:
      summary: Mark a formation lesson as completed from the native app.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson progress updated.
          content:
            application/json:
              schema:
                type: object
                required: [success, progress]
                properties:
                  success:
                    type: boolean
                  progress:
                    type: object
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
  /formation/lessons/{lessonId}/sections/{sectionId}/complete:
    post:
      summary: Mark one formation lesson section as completed from the native app.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
        - in: path
          name: sectionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson section progress updated.
          content:
            application/json:
              schema:
                type: object
                required: [success, progress]
                properties:
                  success:
                    type: boolean
                  progress:
                    type: object
        "404":
          description: Section not found for this lesson.
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
  /formation/admin/studio:
    get:
      summary: Read the native formation authoring studio for coordinators and managers.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
      responses:
        "200":
          description: Formation authoring tracks, modules, lessons and summary.
          content:
            application/json:
              schema:
                type: object
                required: [success, community, studio]
                properties:
                  success:
                    type: boolean
                  community:
                    $ref: "#/components/schemas/Community"
                  studio:
                    type: object
        "403":
          description: Only coordinators and managers can access formation authoring.
  /formation/admin/lessons:
    post:
      summary: Create a native formation lesson, optionally with initial text/video content.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moduleId, title]
              properties:
                moduleId:
                  type: string
                  format: uuid
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                lessonNumber:
                  type: integer
                  minimum: 1
                durationMinutes:
                  type: integer
                  nullable: true
                isActive:
                  type: boolean
                sectionTitle:
                  type: string
                  nullable: true
                sectionContent:
                  type: string
                  nullable: true
                videoUrl:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Formation lesson created.
          content:
            application/json:
              schema:
                type: object
                required: [success, lesson, sections]
                properties:
                  success:
                    type: boolean
                  lesson:
                    type: object
                  sections:
                    type: array
                    items:
                      type: object
        "400":
          description: Invalid payload or missing/invalid Idempotency-Key.
        "403":
          description: Only coordinators and managers can create formation lessons.
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
  /formation/admin/lessons/{lessonId}:
    patch:
      summary: Update native formation lesson metadata.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                lessonNumber:
                  type: integer
                  minimum: 1
                durationMinutes:
                  type: integer
                  nullable: true
                isActive:
                  type: boolean
      responses:
        "200":
          description: Formation lesson updated.
          content:
            application/json:
              schema:
                type: object
                required: [success, lesson, sections]
                properties:
                  success:
                    type: boolean
                  lesson:
                    type: object
                  sections:
                    type: array
                    items:
                      type: object
        "403":
          description: Only coordinators and managers can update formation lessons.
        "404":
          description: Lesson not found.
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
  /formation/admin/lessons/{lessonId}/sections:
    post:
      summary: Create a native formation lesson content section.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                content:
                  type: string
                  nullable: true
                type:
                  type: string
                  enum: [text, video, audio, document, quiz, interactive]
                videoUrl:
                  type: string
                  nullable: true
                audioUrl:
                  type: string
                  nullable: true
                documentUrl:
                  type: string
                  nullable: true
                estimatedMinutes:
                  type: integer
                  nullable: true
                isRequired:
                  type: boolean
      responses:
        "201":
          description: Formation lesson section created.
          content:
            application/json:
              schema:
                type: object
                required: [success, section, lesson, sections]
                properties:
                  success:
                    type: boolean
                  section:
                    type: object
                  lesson:
                    type: object
                  sections:
                    type: array
                    items:
                      type: object
        "403":
          description: Only coordinators and managers can create formation content.
        "404":
          description: Lesson not found.
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
  /substitutions:
    get:
      summary: List visible substitution requests for the active community.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
      responses:
        "200":
          description: Visible substitution requests.
          content:
            application/json:
              schema:
                type: object
                required: [success, community, substitutions]
                properties:
                  success:
                    type: boolean
                  community:
                    $ref: "#/components/schemas/Community"
                  substitutions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Substitution"
    post:
      summary: Request a substitution for one of the user's schedules.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleId]
              properties:
                scheduleId:
                  type: string
                  format: uuid
                substituteId:
                  type: string
                  nullable: true
                reason:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Substitution request created.
          content:
            application/json:
              schema:
                type: object
                required: [success, substitution]
                properties:
                  success:
                    type: boolean
                  substitution:
                    $ref: "#/components/schemas/Substitution"
        "400":
          description: Schedule already has an active substitution, is in the past, or Idempotency-Key is invalid.
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
  /substitutions/{id}:
    get:
      summary: Read one visible substitution request.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Substitution details.
          content:
            application/json:
              schema:
                type: object
                required: [success, substitution]
                properties:
                  success:
                    type: boolean
                  substitution:
                    $ref: "#/components/schemas/Substitution"
        "403":
          description: The user cannot see this substitution request.
        "404":
          description: Substitution not found.
  /substitutions/{id}/claim:
    post:
      summary: Claim an open substitution request as the active community user.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Substitution claimed and schedule updated.
          content:
            application/json:
              schema:
                type: object
                required: [success, substitution]
                properties:
                  success:
                    type: boolean
                  substitution:
                    $ref: "#/components/schemas/Substitution"
        "400":
          description: Substitution is unavailable, belongs to the same minister, conflicts with another schedule, is in the past, or Idempotency-Key is invalid.
        "403":
          description: The user cannot claim this substitution request.
        "404":
          description: Substitution not found.
        "409":
          description: Idempotency-Key is already in progress, was reused with a different mutation, or another minister claimed first.
  /admin/community/home:
    get:
      summary: Read the lightweight coordinator community dashboard.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - in: query
          name: month
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Coordinator community dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCommunityHome"
        "403":
          description: User is not a coordinator or manager.
  /admin/schedules/readiness:
    get:
      summary: Read coordinator readiness to preview or publish a monthly schedule.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - in: query
          name: month
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Schedule generation readiness for the active community.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminScheduleReadiness"
        "403":
          description: User is not a coordinator or manager, or the requested community is outside scope.
  /admin/schedules/generate-preview:
    post:
      summary: Generate a scoped schedule preview for the active coordinator community without publishing.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                month:
                  type: string
                  pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Generated schedule preview for review in the native coordinator app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSchedulePreview"
        "400":
          description: Missing questionnaire responses or mass configuration for the requested month.
        "403":
          description: User is not a coordinator or manager, or the requested community is outside scope.
  /admin/schedules/publish:
    post:
      summary: Publish a scoped monthly schedule for the active coordinator community.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSchedulePublishRequest"
      responses:
        "200":
          description: Published schedule with native notifications queued for assigned ministers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSchedulePublish"
        "400":
          description: Questionnaire is not closed, has no responses, or Mass configuration is missing.
        "403":
          description: User is not a coordinator or manager, or the requested community is outside scope.
        "409":
          description: The month already has schedules and replaceExisting was not confirmed.
  /admin/questionnaires/{id}/responses:
    get:
      summary: Read questionnaire responses for the active coordinator community.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Questionnaire responses visible to the coordinator.
          content:
            application/json:
              schema:
                type: object
                required: [success, community, questionnaire, summary, ministers, responses]
                properties:
                  success:
                    type: boolean
                  community:
                    $ref: "#/components/schemas/Community"
                  questionnaire:
                    type: object
                  summary:
                    type: object
                  ministers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminQuestionnaireTargetMinister"
                  responses:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminQuestionnaireResponse"
        "403":
          description: User is not a coordinator or manager.
        "404":
          description: Questionnaire not found in the active community.
  /admin/questionnaires/{id}/reminders:
    post:
      summary: Send questionnaire reminders to pending ministers or ministers with incomplete profile data.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuestionnaireReminderRequest"
      responses:
        "200":
          description: Reminder delivery plan and created notification ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestionnaireReminderResponse"
        "400":
          description: Idempotency-Key is missing or invalid, or the payload is invalid.
        "403":
          description: User is not a coordinator or manager.
        "404":
          description: Questionnaire not found in the active community.
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
  /admin/ministers:
    get:
      summary: Read a lightweight minister directory for the active community.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
      responses:
        "200":
          description: Community minister directory.
          content:
            application/json:
              schema:
                type: object
                required: [success, community, summary, ministers]
                properties:
                  success:
                    type: boolean
                  community:
                    $ref: "#/components/schemas/Community"
                  summary:
                    type: object
                  ministers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminMinister"
        "403":
          description: User is not a coordinator or manager.
  /mission/home:
    get:
      summary: Load the Minha Missao home payload.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - in: query
          name: month
          description: Month used for summary and current questionnaire.
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Mobile home payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionHome"
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Requested community is outside the user's scope.
  /schedules/month:
    get:
      summary: List the authenticated minister's schedules and the public community schedule for a month.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - in: query
          name: month
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Monthly schedule list.
          content:
            application/json:
              schema:
                type: object
                required: [success, community, month, schedules, publicSchedule]
                properties:
                  success:
                    type: boolean
                  community:
                    $ref: "#/components/schemas/Community"
                  month:
                    type: string
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduleSummary"
                  publicSchedule:
                    $ref: "#/components/schemas/PublicScheduleMonth"
  /schedules/{id}:
    get:
      summary: Read a single schedule visible to the authenticated user.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Schedule details.
          content:
            application/json:
              schema:
                type: object
                required: [success, schedule]
                properties:
                  success:
                    type: boolean
                  schedule:
                    $ref: "#/components/schemas/ScheduleDetail"
        "403":
          description: Schedule is outside the user's permission scope.
        "404":
          description: Schedule not found.
  /schedules/{id}/confirm:
    post:
      summary: Confirm or decline the authenticated user's presence for a schedule.
      parameters:
        - $ref: "#/components/parameters/CommunityHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [confirmed, declined]
                  default: confirmed
                declineReason:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Confirmation created or updated idempotently for schedule and minister.
          content:
            application/json:
              schema:
                type: object
                required: [success, confirmation, schedule]
                properties:
                  success:
                    type: boolean
                  confirmation:
                    $ref: "#/components/schemas/ScheduleConfirmation"
                  schedule:
                    type: object
        "400":
          description: Schedule is unpublished, already in the past, or Idempotency-Key is invalid.
        "409":
          description: Idempotency-Key is already in progress or was reused with a different mutation.
        "403":
          description: The user is not assigned to this schedule.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CommunityHeader:
      in: header
      name: X-Community-Id
      schema:
        type: string
      required: false
      description: Optional active community. Community-scoped users can only request their home community.
    DeviceHeader:
      in: header
      name: X-Device-Id
      schema:
        type: string
      required: false
      description: Stable native device identifier generated by the app.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      schema:
        type: string
        format: uuid
      required: true
      description: UUID generated by the app for critical mobile mutations. Completed successful responses may be replayed for safe retries.
  schemas:
    AppConfig:
      type: object
      required: [apiVersion, serverTime, minimumSupported, featureFlags, links]
      properties:
        apiVersion:
          type: string
        serverTime:
          type: string
          format: date-time
        platform:
          type: string
          nullable: true
        minimumSupported:
          type: object
        featureFlags:
          type: object
          properties:
            biometrics:
              type: boolean
            pushRegistration:
              type: boolean
            refreshTokenRotation:
              type: boolean
            coordinatorMobile:
              type: boolean
        links:
          type: object
    LoginResponse:
      type: object
      required: [success, auth, user, communities, activeCommunityId, device, capabilities]
      properties:
        success:
          type: boolean
        auth:
          type: object
          required: [tokenType, accessToken, refreshToken, refreshTokenExpiresAt, sessionToken, expiresInSeconds, keepSignedIn]
          properties:
            tokenType:
              type: string
              enum: [Bearer]
            accessToken:
              type: string
            refreshToken:
              type: string
              nullable: true
            refreshTokenExpiresAt:
              type: string
              format: date-time
              nullable: true
            sessionToken:
              type: string
              nullable: true
            expiresInSeconds:
              type: integer
              nullable: true
            keepSignedIn:
              type: boolean
        user:
          $ref: "#/components/schemas/MobileUser"
        communities:
          type: array
          items:
            $ref: "#/components/schemas/Community"
        activeCommunityId:
          type: string
        device:
          allOf:
            - $ref: "#/components/schemas/MobileDevice"
            - type: object
              properties:
                registered:
                  type: boolean
        capabilities:
          type: object
    MobileUser:
      type: object
      required: [id, email, name, role, homeCommunityId, requiresPasswordChange, photoUrl]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        homeCommunityId:
          type: string
        requiresPasswordChange:
          type: boolean
        photoUrl:
          type: string
          nullable: true
    MobileDevice:
      type: object
      required:
        - id
        - deviceId
        - platform
        - pushEnabled
        - notificationPreferences
        - biometricCapable
        - biometricEnabled
        - lastSeenAt
        - revokedAt
        - createdAt
      properties:
        id:
          type: string
        deviceId:
          type: string
        platform:
          type: string
        appVersion:
          type: string
          nullable: true
        pushEnabled:
          type: boolean
        pushProvider:
          type: string
          nullable: true
        notificationPreferences:
          type: object
        biometricCapable:
          type: boolean
        biometricEnabled:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    MobileProfile:
      type: object
      required:
        - id
        - email
        - name
        - phone
        - whatsapp
        - role
        - status
        - photoUrl
        - homeCommunityId
        - scheduleDisplayName
        - ministryStartDate
        - maritalStatus
        - preferredPosition
        - preferredPositions
        - avoidPositions
        - preferredTimes
        - availableForSpecialEvents
        - extraActivities
        - requiresPasswordChange
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        role:
          type: string
        status:
          type: string
        photoUrl:
          type: string
          nullable: true
        homeCommunityId:
          type: string
        scheduleDisplayName:
          type: string
          nullable: true
        ministryStartDate:
          type: string
          nullable: true
        maritalStatus:
          type: string
          nullable: true
        preferredPosition:
          type: integer
          nullable: true
        preferredPositions:
          type: array
          items:
            type: integer
        avoidPositions:
          type: array
          items:
            type: integer
        preferredTimes:
          type: array
          items:
            type: string
        availableForSpecialEvents:
          type: boolean
        extraActivities:
          type: object
        requiresPasswordChange:
          type: boolean
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
    MobileNotification:
      type: object
      required: [id, type, eventKey, title, message, priority, read, readAt, deepLink, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
        eventKey:
          type: string
          nullable: true
          enum:
            - questionnaire_published
            - coordinator_announcement
            - questionnaire_closed
            - schedule_published
            - substitution_requested
            - substitute_accepted
            - formation_available
            - schedule_reminder
        title:
          type: string
        message:
          type: string
        priority:
          type: string
          nullable: true
        read:
          type: boolean
        readAt:
          type: string
          nullable: true
        deepLink:
          type: string
        createdAt:
          type: string
          nullable: true
    Community:
      type: object
      required: [id, name, slug, colorHex, parishName, isMatriz]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        colorHex:
          type: string
        parishName:
          type: string
        isMatriz:
          type: boolean
    Questionnaire:
      type: object
      required:
        - id
        - title
        - month
        - year
        - status
        - questions
        - deadline
        - responseStatus
        - response
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        month:
          type: integer
        year:
          type: integer
        status:
          type: string
        questions:
          type: object
        deadline:
          type: string
          nullable: true
        responseStatus:
          type: string
          enum: [pending, answered]
        response:
          type: object
          nullable: true
    QuestionnaireAnswer:
      type: object
      required: [questionId, answer]
      properties:
        questionId:
          type: string
        answer:
          oneOf:
            - type: string
            - type: boolean
            - type: array
              items:
                type: string
            - type: object
        metadata:
          type: object
    Substitution:
      type: object
      required:
        - id
        - scheduleId
        - requesterId
        - status
        - urgency
        - schedule
        - deepLink
        - createdAt
      properties:
        id:
          type: string
        scheduleId:
          type: string
        requesterId:
          type: string
        substituteId:
          type: string
          nullable: true
        status:
          type: string
        reason:
          type: string
          nullable: true
        urgency:
          type: string
          enum: [low, medium, high, critical]
        responseMessage:
          type: string
          nullable: true
        schedule:
          type: object
        requester:
          $ref: "#/components/schemas/SubstitutionUser"
          nullable: true
        substitute:
          $ref: "#/components/schemas/SubstitutionUser"
          nullable: true
        deepLink:
          type: string
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
    SubstitutionUser:
      type: object
      required: [id, name, email, photoUrl]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        photoUrl:
          type: string
          nullable: true
    ScheduleConfirmation:
      type: object
      required: [id, scheduleId, ministerId, status, respondedAt]
      properties:
        id:
          type: string
        scheduleId:
          type: string
        ministerId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, declined, no_response, no_show]
        respondedAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
    AdminCommunityHome:
      type: object
      required: [success, community, month, metrics, questionnaire, coverage, substitutions]
      properties:
        success:
          type: boolean
        community:
          $ref: "#/components/schemas/Community"
        month:
          type: string
          description: Effective questionnaire month when a published questionnaire is available; otherwise the requested month.
        metrics:
          type: object
          required:
            - activeMinisters
            - publishedAssignments
            - pendingSubstitutions
            - questionnaireResponses
            - questionnairePending
          properties:
            activeMinisters:
              type: integer
            publishedAssignments:
              type: integer
            pendingSubstitutions:
              type: integer
            questionnaireResponses:
              type: integer
            questionnairePending:
              type: integer
              nullable: true
            questionnaireTarget:
              type: integer
              nullable: true
            profileReady:
              type: integer
            profileNeedsAttention:
              type: integer
            profileBlocked:
              type: integer
        questionnaire:
          type: object
          nullable: true
          required: [id, title, month, year, responses, pending, target, responseRate, deepLink]
          properties:
            id:
              type: string
            title:
              type: string
            month:
              type: integer
            year:
              type: integer
            responses:
              type: integer
            pending:
              type: integer
            target:
              type: integer
            responseRate:
              type: integer
            deepLink:
              type: string
        coverage:
          type: array
          items:
            type: object
            required: [date, time, type, assigned, vacancies, scheduleIds, status]
            properties:
              date:
                type: string
              time:
                type: string
              type:
                type: string
              location:
                type: string
                nullable: true
              assigned:
                type: integer
              vacancies:
                type: integer
              scheduleIds:
                type: array
                items:
                  type: string
              status:
                type: string
                enum: [covered, needs_attention]
        substitutions:
          type: array
          items:
            $ref: "#/components/schemas/Substitution"
    AdminScheduleReadiness:
      type: object
      required:
        - success
        - community
        - month
        - readiness
        - ministers
        - questionnaire
        - massConfig
        - existingSchedules
      properties:
        success:
          type: boolean
        community:
          $ref: "#/components/schemas/Community"
        month:
          type: string
        readiness:
          type: object
          required: [canPreview, canPublish, blockers, publishBlockers, warnings]
          properties:
            canPreview:
              type: boolean
            canPublish:
              type: boolean
            blockers:
              type: array
              items:
                type: string
            publishBlockers:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
        ministers:
          type: object
          required: [active, ready, needsAttention, blocked]
          properties:
            active:
              type: integer
            ready:
              type: integer
            needsAttention:
              type: integer
            blocked:
              type: integer
        questionnaire:
          type: object
          nullable: true
          required: [id, title, month, year, status, deadline, targetCount, responseCount, pendingCount, responseRate]
          properties:
            id:
              type: string
            title:
              type: string
            month:
              type: integer
            year:
              type: integer
            status:
              type: string
            deadline:
              type: string
              nullable: true
            targetCount:
              type: integer
            responseCount:
              type: integer
            pendingCount:
              type: integer
            responseRate:
              type: integer
        massConfig:
          type: object
          required: [configuredSlots]
          properties:
            configuredSlots:
              type: integer
        existingSchedules:
          type: object
          required: [total, draft, scheduled, published, completed]
          properties:
            total:
              type: integer
            draft:
              type: integer
            scheduled:
              type: integer
            published:
              type: integer
            completed:
              type: integer
    AdminSchedulePreview:
      type: object
      required: [success, community, month, generatedAt, questionnaire, summary, schedules]
      properties:
        success:
          type: boolean
        community:
          $ref: "#/components/schemas/Community"
        month:
          type: string
        generatedAt:
          type: string
        questionnaire:
          type: object
          required: [id, title, month, year, status, responseCount]
          properties:
            id:
              type: string
            title:
              type: string
            month:
              type: integer
            year:
              type: integer
            status:
              type: string
            responseCount:
              type: integer
        summary:
          type: object
          required: [totalMasses, totalAssignments, totalVacancies, averageConfidence, lowConfidenceMasses]
          properties:
            totalMasses:
              type: integer
            totalAssignments:
              type: integer
            totalVacancies:
              type: integer
            averageConfidence:
              type: integer
            lowConfidenceMasses:
              type: integer
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/AdminSchedulePreviewItem"
    AdminSchedulePublishRequest:
      type: object
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        replaceExisting:
          type: boolean
          default: false
    AdminSchedulePublish:
      type: object
      required: [success, community, month, publishedAt, questionnaire, summary, schedules]
      properties:
        success:
          type: boolean
        community:
          $ref: "#/components/schemas/Community"
        month:
          type: string
        publishedAt:
          type: string
        questionnaire:
          type: object
          required: [id, title, month, year, status, responseCount]
          properties:
            id:
              type: string
            title:
              type: string
            month:
              type: integer
            year:
              type: integer
            status:
              type: string
            responseCount:
              type: integer
        summary:
          type: object
          required:
            - totalMasses
            - totalAssignments
            - totalVacancies
            - averageConfidence
            - lowConfidenceMasses
            - publishedAssignments
            - notificationsQueued
            - replacedSchedules
          properties:
            totalMasses:
              type: integer
            totalAssignments:
              type: integer
            totalVacancies:
              type: integer
            averageConfidence:
              type: integer
            lowConfidenceMasses:
              type: integer
            publishedAssignments:
              type: integer
            notificationsQueued:
              type: integer
            replacedSchedules:
              type: integer
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/AdminSchedulePreviewItem"
    AdminSchedulePreviewMinister:
      type: object
      required: [id, name, position, availabilityScore]
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
        position:
          type: integer
        availabilityScore:
          type: integer
    AdminSchedulePreviewItem:
      type: object
      required:
        - date
        - time
        - type
        - displayName
        - location
        - requiredMinisters
        - maxMinisters
        - assignedMinisters
        - vacancies
        - confidence
        - status
        - ministers
        - backupMinisters
      properties:
        date:
          type: string
          nullable: true
        time:
          type: string
        type:
          type: string
        displayName:
          type: string
        location:
          type: string
          nullable: true
        requiredMinisters:
          type: integer
        maxMinisters:
          type: integer
        assignedMinisters:
          type: integer
        vacancies:
          type: integer
        confidence:
          type: integer
        status:
          type: string
          enum: [covered, needs_attention]
        ministers:
          type: array
          items:
            $ref: "#/components/schemas/AdminSchedulePreviewMinister"
        backupMinisters:
          type: array
          items:
            $ref: "#/components/schemas/AdminSchedulePreviewMinister"
    ProfileReadinessIssue:
      type: object
      required: [field, label, severity, message]
      properties:
        field:
          type: string
        label:
          type: string
        severity:
          type: string
          enum: [critical, recommended, future]
        message:
          type: string
    ProfileReadiness:
      type: object
      required: [status, score, missing, completedFields]
      properties:
        status:
          type: string
          enum: [ready, needs_attention, blocked]
        score:
          type: integer
          minimum: 0
          maximum: 100
        missing:
          type: array
          items:
            $ref: "#/components/schemas/ProfileReadinessIssue"
        completedFields:
          type: array
          items:
            type: string
    AdminQuestionnaireTargetMinister:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - whatsapp
        - displayName
        - responded
        - responseId
        - respondedAt
        - availability
        - dataQuality
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        displayName:
          type: string
        responded:
          type: boolean
        responseId:
          type: string
          nullable: true
        respondedAt:
          type: string
          nullable: true
        availability:
          type: string
          nullable: true
        dataQuality:
          $ref: "#/components/schemas/ProfileReadiness"
    AdminQuestionnaireResponse:
      type: object
      required:
        - id
        - userId
        - ministerName
        - canSubstitute
        - availableSundays
