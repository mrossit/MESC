            - schedule_published
            - substitution_requested
            - substitute_accepted
            - formation_available
            - schedule_reminder
        title:
          type: string
        message:
          type: string
        priority:
          type: string
          nullable: true
        read:
          type: boolean
        deepLink:
          type: string
        createdAt:
          type: string
          nullable: true
