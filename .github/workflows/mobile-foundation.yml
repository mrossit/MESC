name: Mobile Foundation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: mobile-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-foundation:
    name: Contract, smoke and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Ruby for OpenAPI YAML parse
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: npm ci

      - name: Run mobile foundation gate
        run: npm run ci:mobile-foundation
