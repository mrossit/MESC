<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5C4033">
  <title>Sem Conexão - MESC</title>
  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #F8F4ED 0%, #E8E0D5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #5C4033;
    }

    .container {
      text-align: center;
      max-width: 400px;
      padding: 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(92, 64, 51, 0.1);
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #F8F4ED;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 40px;
      height: 40px;
      color: #5C4033;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #5C4033;
    }

    p {
      font-size: 16px;
      color: #7A6A5A;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .tips {
      text-align: left;
      background: #F8F4ED;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .tips h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #5C4033;
    }

    .tips ul {
      list-style: none;
      font-size: 14px;
      color: #7A6A5A;
    }

    .tips li {
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tips li::before {
      content: "•";
      color: #D4AF37;
      font-weight: bold;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      background: #5C4033;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #4A3328;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: #5C4033;
      border: 1px solid #D4D0C8;
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background: #F8F4ED;
    }

    .status {
      margin-top: 24px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .status.online {
      display: block;
      background: #D4EDDA;
      color: #155724;
    }

    .status.checking {
      display: block;
      background: #FFF3CD;
      color: #856404;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin-bottom: 16px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
        color: #E8E0D5;
      }

      .container {
        background: #2D2D2D;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }

      h1 {
        color: #E8E0D5;
      }

      p, .tips ul {
        color: #B0A090;
      }

      .tips, .icon {
        background: #3D3D3D;
      }

      .tips h3 {
        color: #E8E0D5;
      }

      .btn-secondary {
        color: #E8E0D5;
        border-color: #4D4D4D;
      }

      .btn-secondary:hover {
        background: #3D3D3D;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/images/icon-192.png" alt="MESC" class="logo" onerror="this.style.display='none'">

    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
      </svg>
    </div>

    <h1>Sem Conexão</h1>
    <p>Parece que você está offline. Verifique sua conexão com a internet e tente novamente.</p>

    <div class="tips">
      <h3>O que você pode fazer:</h3>
      <ul>
        <li>Verificar se o Wi-Fi está conectado</li>
        <li>Verificar se os dados móveis estão ativados</li>
        <li>Tentar se aproximar do roteador</li>
        <li>Reiniciar o roteador ou dispositivo</li>
      </ul>
    </div>

    <button class="btn" onclick="tryReconnect()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Tentar Novamente
    </button>

    <button class="btn btn-secondary" onclick="goToDashboard()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      Ir para o Dashboard
    </button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');

    // Check online status
    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusEl.className = 'status online';
        statusEl.textContent = 'Conexão restaurada! Redirecionando...';
        setTimeout(() => {
          window.location.reload();
        }, 1500);
      }
    }

    window.addEventListener('online', updateOnlineStatus);

    async function tryReconnect() {
      statusEl.className = 'status checking';
      statusEl.textContent = 'Verificando conexão...';

      try {
        const response = await fetch('/api/health', {
          method: 'HEAD',
          cache: 'no-store'
        });

        if (response.ok) {
          statusEl.className = 'status online';
          statusEl.textContent = 'Conexão restaurada! Redirecionando...';
          setTimeout(() => {
            window.location.reload();
          }, 1000);
        } else {
          throw new Error('Server error');
        }
      } catch (error) {
        statusEl.className = 'status';
        statusEl.style.display = 'block';
        statusEl.style.background = '#F8D7DA';
        statusEl.style.color = '#721C24';
        statusEl.textContent = 'Ainda sem conexão. Tente novamente em alguns segundos.';

        setTimeout(() => {
          statusEl.style.display = 'none';
        }, 3000);
      }
    }

    function goToDashboard() {
      window.location.href = '/dashboard';
    }

    // Check on load
    if (navigator.onLine) {
      updateOnlineStatus();
    }
  </script>
</body>
</html>
